<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Pet Claude della spa</title>
  <style>
    html, body {
      margin: 0;
      width: 160px;
      height: 160px;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    canvas {
      position: absolute;
      left: 8px;
      top: 8px;
      width: 144px;
      height: 144px;
      image-rendering: pixelated;
    }
    canvas.over { cursor: grab; }
    canvas.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <canvas id="pet" width="144" height="144"></canvas>
  <script src="palette.js"></script>
  <script src="sprites.js"></script>
  <script src="animator.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
